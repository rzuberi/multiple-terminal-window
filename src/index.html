<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>multiple-terminal-window</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Multiple Terminal Window</p>
          <h1>multiple-terminal-window</h1>
        </div>
        <div class="controls">
          <input
            id="cwd-input"
            class="cwd-input"
            type="text"
            placeholder="Working directory (optional)"
          />
          <button id="spawn-terminal" class="spawn-button">Spawn Terminal</button>
        </div>
      </header>
      <div id="status-banner" class="status-banner" hidden></div>
      <section id="terminal-grid" class="terminal-grid"></section>
    </main>
    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="./renderer.js"></script>
  </body>
  </html>
